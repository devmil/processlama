[package]
name = "processlama-network-helper"
version = "0.1.0"
edition = "2024"
description = "Privileged Linux eBPF network accounting service for ProcessLama"
publish = false
license = "MIT AND GPL-2.0-only"

[dependencies]
anyhow = "1"
libbpf-rs = "0.26.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
libbpf-cargo = "0.26.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

name: ProcessLama CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  QT_VERSION: "6.11.2"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the workflow validator
        run: python3 -m pip install -r tooling/requirements-ci.txt

      - name: Install Linux build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang pkg-config libelf-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libfontconfig1 libdbus-1-3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          cache: true

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-rust-verify-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-verify-

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml

      - name: Verify
        run: ./scripts/verify.sh

  # The remote helpers every desktop package bundles (docs/10_remote_hosts.md §8).

  remote-helper-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the container engine
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends crun podman

      - name: Install Rust toolchain
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml

      - name: Build the Linux remote helpers on the glibc 2.35 baseline
        env:
          PROCESSLAMA_CONTAINER_ENGINE: ${{ github.workspace }}/scripts/run-workflow-podman.sh
        run: ./scripts/build-remote-helpers-linux.sh

      - name: Upload the Linux remote helpers
        uses: actions/upload-artifact@v4
        with:
          name: processlama-remote-helper-linux
          path: build/remote-helper/processlama-remote-helper-*.tar.gz
          if-no-files-found: error

  remote-helper-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml

      - name: Build the macOS remote helpers
        run: ./scripts/build-remote-helpers-macos.sh

      - name: Upload the macOS remote helpers
        uses: actions/upload-artifact@v4
        with:
          name: processlama-remote-helper-macos
          path: build/remote-helper/processlama-remote-helper-*.tar.gz
          if-no-files-found: error

  # Release bundling with every helper required, as release CI runs it.

  package-linux:
    runs-on: ubuntu-24.04
    needs: [verify, remote-helper-linux, remote-helper-macos]
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux packaging prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang pkg-config libelf-dev patchelf \
            rpm dpkg-dev tar cpio libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3
          appimage_tool_dir="$RUNNER_TEMP/processlama-appimagetool"
          mkdir -p "$appimage_tool_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$appimage_tool_dir/appimagetool.download" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $appimage_tool_dir/appimagetool.download" \
            | sha256sum --check --strict
          chmod 0755 "$appimage_tool_dir/appimagetool.download"
          mv -f "$appimage_tool_dir/appimagetool.download" "$appimage_tool_dir/appimagetool"
          echo "$appimage_tool_dir" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          modules: qtwaylandcompositor
          cache: true

      - name: Install Rust toolchain
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path rust-core/Cargo.toml
          cargo fetch --locked --manifest-path linux/network-helper/Cargo.toml

      - name: Download the Linux remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-linux
          path: build/remote-helper-artifacts

      - name: Download the macOS remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-macos
          path: build/remote-helper-artifacts

      - name: Package Linux bundles with every remote helper
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          MIM_RELEASE_CHANNEL: beta
          PROCESSLAMA_REQUIRE_REMOTE_HELPER: "1"
        run: |
          set -euo pipefail
          python3 scripts/package_remote_helper.py unpack \
            --archives build/remote-helper-artifacts --output build/remote-helper
          ./scripts/package-linux.sh --formats appimage,rpm,deb,tar,arch
          python3 scripts/check_bundled_helpers.py build/archive

      - name: Smoke test the packaged bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf build/archive/ProcessLama-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/smoke"
          export PROCESSLAMA_DATA_DIR="$RUNNER_TEMP/smoke-data" QT_QPA_PLATFORM=offscreen
          export PROCESSLAMA_SCREENSHOT="$RUNNER_TEMP/smoke/window.png"
          timeout 60 "$RUNNER_TEMP/smoke/ProcessLama/processlama"
          test -s "$RUNNER_TEMP/smoke/window.png"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: processlama-linux-packages
          path: build/archive/ProcessLama-*-linux-*
          if-no-files-found: error

  package-macos:
    runs-on: macos-15
    needs: [verify, remote-helper-linux, remote-helper-macos]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          cache: true

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Download the remote helpers
        uses: actions/download-artifact@v4
        with:
          pattern: processlama-remote-helper-*
          merge-multiple: true
          path: build/remote-helper-artifacts

      - name: Build ProcessLama.app and the DMG (ad hoc signed)
        env:
          PROCESSLAMA_REQUIRE_REMOTE_HELPER: "1"
        run: |
          set -euo pipefail
          python3 scripts/package_remote_helper.py unpack \
            --archives build/remote-helper-artifacts --output build/remote-helper
          ./scripts/package-macos.sh

      - name: Smoke test the app
        run: |
          set -euo pipefail
          export PROCESSLAMA_DATA_DIR="$RUNNER_TEMP/smoke-data" PROCESSLAMA_SCREENSHOT="$RUNNER_TEMP/window.png"
          build/macos/ProcessLama.app/Contents/MacOS/ProcessLama &
          pid=$!
          for _ in $(seq 60); do [[ -s "$RUNNER_TEMP/window.png" ]] && break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          test -s "$RUNNER_TEMP/window.png"

      - name: Upload the macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: processlama-macos-dmg
          path: build/archive/ProcessLama-*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    needs: verify
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # aqtinstall cannot read Qt 6.11's per-architecture Windows repository.
      - name: Install Qt
        shell: pwsh
        run: python scripts/install-qt-windows.py --version $env:QT_VERSION --output "$env:RUNNER_TEMP/Qt"

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version

      - name: Build the application
        shell: pwsh
        run: cargo build --release --locked --manifest-path rust-core/Cargo.toml -p processlama

      - name: Deploy Qt next to the executable
        shell: pwsh
        run: |
          $out = "build/windows/ProcessLama"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item rust-core/target/release/processlama.exe $out/
          windeployqt --release --qmldir qml/ProcessLama --qmlimport qml --no-translations "$out/processlama.exe"
          python scripts/package_licenses.py $out
          Compress-Archive -Path "$out/*" -DestinationPath build/windows/ProcessLama-windows-x64.zip

      - name: Smoke test the build
        shell: pwsh
        run: |
          $env:PROCESSLAMA_DATA_DIR = "$env:RUNNER_TEMP/smoke-data"
          $env:PROCESSLAMA_SCREENSHOT = "$env:RUNNER_TEMP/window.png"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          # The offscreen platform is for this test only; the package ships qwindows.
          $smoke = "$env:RUNNER_TEMP/smoke"
          Copy-Item -Recurse build/windows/ProcessLama $smoke
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$smoke/plugins/platforms/"
          $process = Start-Process -FilePath "$smoke/processlama.exe" -PassThru `
            -RedirectStandardError "$env:RUNNER_TEMP/smoke.log" -RedirectStandardOutput "$env:RUNNER_TEMP/smoke.out"
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$env:RUNNER_TEMP/window.png"); $i++) { Start-Sleep 1 }
          Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/smoke.log" -ErrorAction SilentlyContinue | Select-Object -First 40
          if (-not (Test-Path "$env:RUNNER_TEMP/window.png")) { throw "no window rendered" }

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: processlama-windows
          path: build/windows/ProcessLama-windows-x64.zip
          if-no-files-found: error

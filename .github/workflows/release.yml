name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version change; none resumes the current prepared release
        required: true
        type: choice
        default: beta
        options: [none, build, beta, promote, patch, minor, major]
      channel:
        description: Release channel
        required: true
        type: choice
        default: beta
        options: [beta, stable]

concurrency:
  group: processlama-desktop-release
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 90
    runs-on: macos-15
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      publish_sha: ${{ steps.release.outputs.publish_sha }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Check out main with release credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Flutter
        uses: ./.github/actions/flutter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned workflow validator
        run: python3 -m pip install --disable-pip-version-check -r tooling/requirements-ci.txt
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          else
            rustup default stable
          fi
          rustup component add rustfmt
          rustc --version
          cargo --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Validate release credentials before preparing a version
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          source scripts/lib/release-secrets.sh
          source scripts/lib/validate-release-secrets.sh
          release_tmp="$(mktemp -d)"
          trap 'rm -rf -- "$release_tmp"' EXIT
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          processlama_validate_release_secrets "$release_tmp" "$openssl_bin"
      # Fetch before Flutter's native-assets hook filters the Git/Cargo auth
      # environment. Restored Cargo caches may not contain the pinned revision.
      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml

      - name: Prepare, verify, and push release commit
        id: release
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME:-}" == main ]]
          git config user.name "ProcessLama Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ inputs.bump }}" == none ]]; then
            export MIM_REPO_ROOT="$PWD"
            export MIM_RELEASE_CHANNEL="${{ inputs.channel }}"
            source scripts/lib/release-channel.sh
            source scripts/lib/release-git.sh
            mim_require_clean_for_release
            mim_validate_release_channel_version
            release_sha="$(mim_resolve_existing_release_commit)"
            publish_sha="$(git rev-parse HEAD)"
            ./scripts/verify.sh
            echo "==> Resuming $(mim_release_tag_name) from $release_sha" >&2
          else
            release_args=(
              --channel "${{ inputs.channel }}"
              --bump "${{ inputs.bump }}"
              --no-git-tag
            )
            if [[ "${{ inputs.bump }}" == build ]]; then
              release_args+=(--no-changelog-check)
            fi
              ./scripts/release.sh "${release_args[@]}"
            git push origin HEAD:main
            release_sha="$(git rev-parse HEAD)"
            publish_sha="$release_sha"
          fi
          version="$(sed -n '1p' VERSION)"
          build="$(sed -n '2p' VERSION)"
          tag="v${version}-${build}"
          output_file="${GITHUB_OUTPUT:-}"
          {
            echo "release_sha=$release_sha"
            echo "publish_sha=$publish_sha"
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "channel=${{ inputs.channel }}"
          } >> "$output_file"

  # The remote helpers every desktop package bundles (docs/10_remote_hosts.md §8).

  remote-helper-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: prepare
    steps:
      - name: Check out prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Install the container engine
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y crun podman
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends crun podman
          else
            echo "::error::The Linux runner needs dnf or apt-get" >&2
            exit 1
          fi
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml
      - name: Build the Linux remote helpers on the glibc 2.35 baseline
        shell: bash
        env:
          PROCESSLAMA_CONTAINER_ENGINE: ${{ github.workspace }}/scripts/run-workflow-podman.sh
        run: ./scripts/build-remote-helpers-linux.sh
      - name: Upload the Linux remote helpers
        uses: actions/upload-artifact@v4
        with:
          name: processlama-remote-helper-linux
          path: build/remote-helper/processlama-remote-helper-*.tar.gz
          if-no-files-found: error


  remote-helper-macos:
    runs-on: macos-15
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Check out prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          else
            rustup default stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml
      - name: Build the macOS remote helpers
        shell: bash
        run: ./scripts/build-remote-helpers-macos.sh
      - name: Upload the macOS remote helpers
        uses: actions/upload-artifact@v4
        with:
          name: processlama-remote-helper-macos
          path: build/remote-helper/processlama-remote-helper-*.tar.gz
          if-no-files-found: error


  network-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: prepare
    steps:
      - name: Check out prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Install the container engine and the arm64 emulator
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y crun podman qemu-user-static
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends crun podman qemu-user-static binfmt-support
          else
            echo "::error::The Linux runner needs dnf or apt-get" >&2
            exit 1
          fi
          machine="$(./scripts/run-workflow-podman.sh run --rm --arch arm64 docker.io/library/ubuntu:22.04 uname -m)"
          [[ "$machine" == aarch64 ]] || {
            echo "::error::The runner cannot run arm64 containers (got '$machine')" >&2; exit 1;
          }
      # The aarch64 build runs natively under qemu; cross-compiling BPF with
      # libbpf is avoided (docs/10_remote_hosts.md §8.5).
      - name: Build the network service packages
        shell: bash
        env:
          PROCESSLAMA_CONTAINER_ENGINE: ${{ github.workspace }}/scripts/run-workflow-podman.sh
        run: |
          set -euo pipefail
          ./scripts/package-network-helper.sh
          ./scripts/check_network_service_packages.sh x86_64
          ./scripts/check_network_service_packages.sh aarch64
      - name: Upload the network service packages
        uses: actions/upload-artifact@v4
        with:
          name: processlama-network-service
          path: build/network-service/processlama-network-service-*
          if-no-files-found: error


  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: [prepare, remote-helper-linux, remote-helper-macos]
    steps:
      - name: Check out prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Install Linux packaging prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            sudo dnf install -y clang cmake curl ninja-build gtk3-devel libblkid-devel \
              xz-devel elfutils-libelf-devel patchelf rpm-build dpkg tar
          elif command -v apt-get >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends clang cmake curl ninja-build \
              libgtk-3-dev libblkid-dev liblzma-dev libelf-dev pkg-config patchelf \
              rpm dpkg-dev tar
          else
            echo "::error::The Linux runner needs dnf or apt-get" >&2
            exit 1
          fi
          appimage_tool_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/processlama-appimagetool"
          appimage_tool="$appimage_tool_dir/appimagetool"
          appimage_tool_download="$appimage_tool.download"
          mkdir -p "$appimage_tool_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$appimage_tool_download" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          # Keep the version and checksum paired; continuous replaces its asset.
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $appimage_tool_download" \
            | sha256sum --check --strict
          chmod 0755 "$appimage_tool_download"
          mv -f "$appimage_tool_download" "$appimage_tool"
          echo "$appimage_tool_dir" >> "$GITHUB_PATH"
          export PATH="$appimage_tool_dir:$PATH"
          command -v appimagetool >/dev/null
      - name: Setup Flutter
        uses: ./.github/actions/flutter
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          else
            rustup default stable
          fi
          rustup component add rustfmt
          rustc --version
          cargo --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Fetch before Flutter's native-assets hook filters the Git/Cargo auth
      # environment. Restored Cargo caches may not contain the pinned revision.
      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml

      - name: Download the Linux remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-linux
          path: build/remote-helper-artifacts
      - name: Download the macOS remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-macos
          path: build/remote-helper-artifacts
      - name: Build Linux release bundles
        shell: bash
        env:
          MIM_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          PROCESSLAMA_REQUIRE_REMOTE_HELPER: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          python3 scripts/package_remote_helper.py unpack \
            --archives build/remote-helper-artifacts --output build/remote-helper
            ./scripts/package-linux.sh
          python3 scripts/check_bundled_helpers.py build/archive
      - name: Upload Linux release bundles
        uses: actions/upload-artifact@v4
        with:
          name: ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}-linux
          path: build/archive/ProcessLama-*-linux-*
          if-no-files-found: error


  macos:
    runs-on: macos-15
    timeout-minutes: 45
    needs: [prepare, remote-helper-linux, remote-helper-macos]
    steps:
      - name: Check out prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Setup Flutter
        uses: ./.github/actions/flutter
      - name: Cache Swift Package Manager downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories/Sparkle-*
            ~/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_sparkle_project_Sparkle_releases_download_*
          key: ${{ runner.os }}-processlama-sparkle-v1-${{ hashFiles('macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          else
            rustup default stable
          fi
          rustup component add rustfmt
          rustc --version
          cargo --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install macOS application Rust targets
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Fetch before Flutter's native-assets hook filters the Git/Cargo auth
      # environment. Restored Cargo caches may not contain the pinned revision.
      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked --manifest-path rust-core/Cargo.toml

      - name: Download the Linux remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-linux
          path: build/remote-helper-artifacts
      - name: Download the macOS remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-macos
          path: build/remote-helper-artifacts
      - name: Build, sign, notarize, and sign the update
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          MIM_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          PROCESSLAMA_REQUIRE_REMOTE_HELPER: "1"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set +x
          set -euo pipefail
          umask 077
          for tool in brew codesign security xcrun; do
            command -v "$tool" >/dev/null || { echo "::error::Missing $tool" >&2; exit 1; }
          done
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          [[ -x "$openssl_bin" ]] || {
            echo "::error::Homebrew OpenSSL 3 is required for Ed25519 key validation" >&2
            exit 1
          }
          source scripts/lib/release-secrets.sh
          source scripts/lib/validate-release-secrets.sh
          release_tmp="$(mktemp -d)"
          keychain="$release_tmp/processlama-release.keychain-db"
          security list-keychains -d user | python3 scripts/lib/keychain_paths.py > "$release_tmp/original-keychains"
          original_keychains=()
          while IFS= read -r keychain_path; do
            original_keychains+=("$keychain_path")
          done < "$release_tmp/original-keychains"
          [[ "${#original_keychains[@]}" -gt 0 ]]
          cleanup() {
            security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf -- "$release_tmp"
          }
          trap cleanup EXIT
          processlama_validate_release_secrets "$release_tmp" "$openssl_bin"
          codesign_identity="$MACOS_CODESIGN_IDENTITY"
          p12_password="$MACOS_DEVELOPER_ID_P12_PASSWORD"
          api_key_id="$APPLE_NOTARY_KEY_ID"
          api_issuer_id="$APPLE_NOTARY_ISSUER_ID"
          keychain_password="$("$openssl_bin" rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$release_tmp/developer-id.p12" -k "$keychain" \
            -P "$p12_password" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          codesign_identity="$(security find-identity -v -p codesigning "$keychain" | python3 scripts/lib/codesign_identity.py)"
          python3 scripts/package_remote_helper.py unpack \
            --archives build/remote-helper-artifacts --output build/remote-helper
          export CODESIGN_IDENTITY="$codesign_identity"
          export APPLE_API_KEY_FILE="$release_tmp/notary-api-key.p8"
          export APPLE_API_KEY_ID="$api_key_id"
          export APPLE_API_ISSUER_ID="$api_issuer_id"
            ./scripts/package-release.sh
          lipo -verify_arch arm64 x86_64 build/macos/Build/Products/Release/processlama.app/Contents/MacOS/processlama
          lipo -verify_arch arm64 x86_64 build/macos/Build/Products/Release/processlama.app/Contents/Frameworks/processlama_core.framework/processlama_core
          ./scripts/notarize-release.sh build/archive/ProcessLama.dmg
          mkdir -p build/release-upload
          dmg="build/release-upload/ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}.dmg"
          cp build/archive/ProcessLama.dmg "$dmg"
          source scripts/lib/sparkle-tools.sh
          sign_update="$(mim_sparkle_sign_update)"
          "$sign_update" -p \
            --ed-key-file "$release_tmp/sparkle-ed25519.pem" "$dmg" \
            > "$dmg.sparkle-signature"
          [[ -s "$dmg.sparkle-signature" ]]
      - name: Upload macOS release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}-macos
          path: build/release-upload/*
          if-no-files-found: error


  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    needs: [prepare, remote-helper-linux, remote-helper-macos]
    steps:
      - name: Check out prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Setup Flutter
        uses: ./.github/actions/flutter
      - name: Install pinned .NET SDK for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.414"
      - name: Install Rust and WiX
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Get-Content -Raw '{0}' | Invoke-Expression"
        run: |
          ./scripts/install-rustup-windows.ps1
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain setup failed with exit code $LASTEXITCODE" }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "Rust default toolchain setup failed with exit code $LASTEXITCODE" }
          if (-not (Get-Command dotnet.exe -ErrorAction SilentlyContinue)) {
            throw ".NET SDK is required to install WiX 5"
          }
          $wixRoot = Join-Path $env:RUNNER_TEMP "processlama-wix-${{ github.run_id }}"
          dotnet tool install --tool-path $wixRoot wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed with exit code $LASTEXITCODE" }
          $wix = Join-Path $wixRoot "wix.exe"
          if (-not (Test-Path $wix -PathType Leaf)) { throw "WiX installation did not produce $wix" }
          $wixVersion = (& $wix --version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $wixVersion.StartsWith("5.0.2")) {
            throw "Expected WiX 5.0.2, got $wixVersion"
          }
          $pathFile = $env:GITHUB_PATH
          if (-not $pathFile) { throw "GitHub PATH environment file is unavailable" }
          [IO.File]::AppendAllText($pathFile, "$wixRoot`n", [Text.UTF8Encoding]::new($false))
      # Fetch before Flutter's native-assets hook filters the Git/Cargo auth
      # environment. Restored Cargo caches may not contain the pinned revision.
      - name: Fetch locked Rust dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Get-Content -Raw '{0}' | Invoke-Expression"
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo fetch --locked --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Rust dependency fetch failed with exit code $LASTEXITCODE" }

      - name: Download the Linux remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-linux
          path: build/remote-helper-artifacts
      - name: Download the macOS remote helpers
        uses: actions/download-artifact@v4
        with:
          name: processlama-remote-helper-macos
          path: build/remote-helper-artifacts
      - name: Build and validate Windows release bundles
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Get-Content -Raw '{0}' | Invoke-Expression"
        env:
          PROCESSLAMA_REQUIRE_REMOTE_HELPER: "1"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          $helperRoot = Join-Path $PWD "build\remote-helper"
          New-Item -ItemType Directory -Force $helperRoot | Out-Null
          Get-ChildItem -Recurse -Filter "processlama-remote-helper-*.tar.gz" build\remote-helper-artifacts | ForEach-Object {
            & "$env:SystemRoot\System32\tar.exe" -xzf $_.FullName -C $helperRoot
            if ($LASTEXITCODE -ne 0) { throw "Could not extract $($_.Name)" }
          }
          . ./scripts/initialize-msvc-environment.ps1
          ./scripts/package-windows.ps1
      - name: Upload Windows release bundles
        uses: actions/upload-artifact@v4
        with:
          name: ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}-windows
          path: |
            build/archive/ProcessLama-*-windows-x86_64.zip
            build/archive/ProcessLama-*-windows-x86_64.msi
          if-no-files-found: error


  publish:
    runs-on: ubuntu-24.04
    needs: [prepare, network-service, linux, macos, windows]
    steps:
      - name: Check out prepared release with publication credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.publish_sha }}
          fetch-depth: 0
      - name: Download Linux release bundles
        uses: actions/download-artifact@v4
        with:
          name: ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}-linux
          path: build/final-release
      - name: Download macOS release bundle
        uses: actions/download-artifact@v4
        with:
          name: ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}-macos
          path: build/final-release
      - name: Download Windows release bundles
        uses: actions/download-artifact@v4
        with:
          name: ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}-windows
          path: build/final-release
      - name: Download the network service packages
        uses: actions/download-artifact@v4
        with:
          name: processlama-network-service
          path: build/final-release
      - name: Publish GitHub Releases and website metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY_NAME" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Repository must be owner/repository" >&2; exit 1;
          }
          git config user.name "ProcessLama Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "${{ needs.prepare.outputs.publish_sha }}" ]] || {
            echo "::error::main changed after release preparation" >&2; exit 1;
          }
          if git rev-parse --verify --quiet "refs/tags/${{ needs.prepare.outputs.tag }}" >/dev/null; then
            [[ "$(git cat-file -t "${{ needs.prepare.outputs.tag }}")" == tag ]]
            [[ "$(git rev-list -n1 "${{ needs.prepare.outputs.tag }}")" == "${{ needs.prepare.outputs.release_sha }}" ]]
          else
            git tag -a "${{ needs.prepare.outputs.tag }}" -m \
              "ProcessLama ${{ needs.prepare.outputs.version }} (build ${{ needs.prepare.outputs.build }})" \
              "${{ needs.prepare.outputs.release_sha }}"
            git push origin "refs/tags/${{ needs.prepare.outputs.tag }}"
          fi
          release_dir="build/final-release"
          python3 scripts/check_release_artifacts.py "$release_dir" \
            --version "${{ needs.prepare.outputs.version }}" --build "${{ needs.prepare.outputs.build }}"
          data="website/_data/releases.json"
          notes_name="ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}.html"
          python3 scripts/lib/website_release.py notes --notes RELEASE_NOTES.md \
            --version "${{ needs.prepare.outputs.version }}" \
            --output "website/download/$notes_name"
          signature="$(tr -d '\r\n' < "$release_dir/ProcessLama-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}.dmg.sparkle-signature")"
          for artifact in "$release_dir"/ProcessLama-* "$release_dir"/processlama-network-service-*; do
            [[ "$artifact" == *.sparkle-signature ]] && continue
            filename="$(basename "$artifact")"
            case "$filename" in
              processlama-network-service-*)
                platform=linux-network; minimum="glibc 2.34, systemd"; extra=()
                case "$filename" in
                  *-linux-x86_64.*) arch="x86_64" ;;
                  *-linux-aarch64.*) arch="aarch64" ;;
                  *) echo "::error::Unexpected network service artifact $filename" >&2; exit 1 ;;
                esac
                case "$filename" in
                  *.rpm) format=rpm ;;
                  *.deb) format=deb ;;
                  *.tar.gz) format=tar ;;
                  *) echo "::error::Unexpected network service artifact $filename" >&2; exit 1 ;;
                esac ;;
              *.dmg) platform=macos; format=dmg; arch="Apple Silicon & Intel"; minimum="macOS 14.0"; extra=(--sparkle-signature "$signature") ;;
              *.AppImage) platform=linux; format=appimage; arch="x86_64"; minimum="Linux"; extra=() ;;
              *.rpm) platform=linux; format=rpm; arch="x86_64"; minimum="Linux"; extra=() ;;
              *.deb) platform=linux; format=deb; arch="x86_64"; minimum="Linux"; extra=() ;;
              *.tar.gz) platform=linux; format=tar; arch="x86_64"; minimum="Linux"; extra=() ;;
              *.msi) platform=windows; format=msi; arch="x86_64"; minimum="Windows 10 1809"; extra=() ;;
              *.zip) platform=windows; format=zip; arch="x86_64"; minimum="Windows 10 1809"; extra=() ;;
              *) echo "::error::Unexpected artifact $filename" >&2; exit 1 ;;
            esac
            url="https://github.com/${GITHUB_REPOSITORY_NAME}/releases/download/${{ needs.prepare.outputs.tag }}/$filename"
            python3 scripts/lib/website_release.py publish --data "$data" \
              --version "${{ needs.prepare.outputs.version }}" \
              --build "${{ needs.prepare.outputs.build }}" \
              --channel "${{ needs.prepare.outputs.channel }}" \
              --artifact "$artifact" --platform "$platform" --format "$format" \
              --architectures "$arch" --minimum-system "$minimum" \
              --notes-path "/download/$notes_name" --download-url "$url" "${extra[@]}"
          done
          python3 scripts/lib/website_release.py render --data "$data" --output website/releases.html
          export MIM_REPO_ROOT="$PWD"
          source scripts/lib/sparkle-appcast.sh
          mim_generate_sparkle_appcast 1
          python3 -m unittest discover -s tests/release -v
          python3 scripts/reconcile-release-hosts.py --metadata "$data" \
            --artifact-root "$release_dir" --legacy-artifact-root website/download \
            github --repository "$GITHUB_REPOSITORY_NAME" --token-env GH_TOKEN
          git add website/_data/releases.json website/releases.html \
            website/download/appcast.xml "website/download/$notes_name"
          git commit -m "Publish ${{ needs.prepare.outputs.tag }} desktop release" \
            -m "Publish retained GitHub release assets and website metadata."
          git push origin HEAD:main


  deploy-website:
    if: ${{ github.repository == 'devmil/processlama' }}
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment

[package]
name = "processlama_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ProcessLama's flutter_rust_bridge facade"

[dependencies]
devmil-logging = { git = "https://github.com/devmil/devmil-logging", rev = "aca7c46d78ed29e283bd01b6d3f43adb481cf297" }
flutter_rust_bridge = "=2.12.0"
processlama_telemetry = { workspace = true }
devmil_remote = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
core-foundation = "0.10"

[lib]
name = "processlama_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
